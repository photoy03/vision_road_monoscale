vision_road:
  ros__parameters:
    detector_backend: paint_evidence
    candidate_mask_enabled: true
    candidate_max_width_m: 0.45
    opencv_threads: 2
    style_temporal_enabled: true
    style_history_sec: 0.8
    style_history_frames: 8
    style_hold_sec: 2.0
    image_topic: /sensing/camera/front/fisheye/image_raw
    odom_topic: /localization/kinematic_state
    world_frame: map
    compressed: false
    lateral_min: -4.0
    lateral_max: 4.0
    forward_min: 0.5
    forward_max: 15.0
    mpp: 0.04
    windows: 20
    margin_m: 0.45
    min_pixels: 45
    min_span_m: 1.0
    fit_error_m: 0.15
    white_l_min: 170
    white_s_max: 100
    yellow_s_min: 80
    lane_width_min: 2.2
    lane_width_max: 5.0
    segment_m: 0.4
    odom_max_gap_sec: 0.25
    pose_wait_sec: 0.5
    max_pending_frames: 30
    map_resolution_m: 0.10
    map_radius_m: 40.0
    map_ttl_sec: 120.0
    map_max_cells: 100000
    map_publish_hz: 2.0
    debug_images: true
    shadow_enabled: true
    ridge_width_m: 0.50
    ridge_contrast_min: 5.0
    local_contrast_min: 0.10
    temporal_enabled: true
    temporal_max_frames: 3
    temporal_max_age_sec: 0.35
    temporal_max_distance_m: 3.0
    temporal_match_m: 0.45
    temporal_use_flow: true
    style_min_span_m: 8.0
    style_min_dash_m: 0.60
    style_min_gap_m: 0.70
    style_confirm_frames: 2
