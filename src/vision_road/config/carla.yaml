vision_road:
  ros__parameters:
    detector_backend: carla
    opencv_threads: 2
    image_reliability: reliable
    image_queue_depth: 10
    image_topic: /carla/ego_vehicle/rgb_front/image
    odom_topic: /carla/ego_vehicle/odometry
    world_frame: map
    base_frame: ego_vehicle
    image_roi_bottom: 0.86
    map_enabled: false
    lateral_min: -6.0
    lateral_max: 6.0
    forward_min: 3.0
    forward_max: 35.0
    mpp: 0.05
    min_span_m: 0.40
    min_pixels: 20
    windows: 24
    margin_m: 0.50
    segment_m: 0.10
    carla_stage: 3
    carla_ridge_min: 3.0
    carla_relative_min: 0.025
    carla_grid_enabled: true
    temporal_enabled: true
    temporal_max_frames: 2
    temporal_max_age_sec: 0.15
    temporal_max_distance_m: 3.0
    temporal_match_m: 0.30
    style_temporal_enabled: true
    style_history_sec: 0.8
    style_history_frames: 8
    style_hold_sec: 1.0
    # Plan 30: a confirmed style is also held until the car has gone 2 m (standing at a red light the line beside
    # the car can be too short to judge).
    style_hold_m: 2.0
    # Curve: a dashed side seen one dash at a time is judged from 12 m of paint gathered along the road.
    style_accumulate_m: 12.0

    # Motion-compensated preference for the confirmed lane; raw paint stays observed.
    carla_tracking_enabled: true
    carla_tracking_keep_bonus: 2.0
    carla_tracking_match_m: 0.35
    carla_tracking_switch_margin: 1.5
    carla_tracking_switch_frames: 3
    carla_tracking_memory_sec: 0.25
    # Curve: a short boundary takes the long side's shape (normal offset), up to 6 m past its own paint.
    carla_shared_shape: true
    carla_shared_extend_m: 6.0
    # Left double line: one pair of rails; centres of seen pairs kept 25 m of travel label a single near strand.
    carla_strand_pair: true
    carla_strand_memory_m: 25.0
    # Intersection approach: a new line ~1.75 m beyond the ended one (lane 3.5 -> 5.3 m wide) is not taken.
    carla_width_reject_m: 1.0
    # Pale yellow paint (Town05: g-b ~13): yellow when (r+g)/2-b is 6 above the road around it and itself.
    carla_yellow_relative_min: 6.0
    # Sharp curves (Town04): a long dense chain that is straight then curving gets a cubic when the quadratic
    # misses its paint by 5 cm (p90); paint beyond 15 m counts less, so far paint cannot bend the near boundary.
    carla_spine_cubic_m: 0.05
    carla_spine_near_m: 15.0
    # ... but not on a double line: there the cubic followed the strand scatter (maploop curve jumps 3 -> 7).
    carla_spine_cubic_double: false
    # A line ending at a stop line does not chain on, across the junction, to the crossing road's edge (Town04 36 s).
    carla_tail_gap_m: 4.0
    # While turning (1/m), a crossing road's line sweeping across the vehicle's arc, or a line on the
    # other side of that arc, is not taken (Town04 39 s; maploop 23 s); a curve's own line bends with the turn.
    carla_turn_curvature: 0.03
    # Real time: the median filter and the paint-history warps run on a second thread (same results).
    carla_parallel_ops: true
    # Plan 25: per-pixel binary steps, the curb test and per-lane loops in C++ (_native); outputs unchanged.
    carla_native_fast: true
    # Plan 26: chain DP, pair vote pair test, solid/dashed sampling in C++ (_native).
    carla_native_chain: true
    # Plan 26: the paint mask on its own thread while the tracks are moved (same results).
    carla_parallel_binary: true
    # Plan 26: spine and pair-vote least squares by QR in C++ (equal to LAPACK up to rounding, not bit for bit).
    carla_native_fit: true
    # Neighbouring lanes (Town05): after the two own lines are chosen (unchanged), each side's next line out,
    # from the paint they left: 2.3-4.7 m (and within 0.9 m of the own lane width) outside the own line along
    # its normal, parallel to it (distance varies <= 0.3 m).  /road/lane_outer, /road/lane_outer_markers.
    carla_outer_enabled: true
    # Plan 31: an outer line at last frame's distance stays with 1.2 m of paint (a new one still needs 2 m): a
    # short view of it (2-4 m, or the car at an angle) keeps the neighbouring lane (s8c recall 78 -> 86 %).
    carla_outer_min_paint_kept_m: 1.2
    # Plan 31: an own line may start right under the car (was 0.65 m to the side at least): while the car centre
    # is on a line the lines stay detected (s5 lane changes 3 -> 4/4, return guidance s3a 65 -> 86 %).
    carla_own_min_m: 0.0
    # Lane centrelines (own lane; the neighbouring lanes beside their outer lines), across the lane, with
    # offset, heading and curvature 5 m ahead.  /road/lane_centres, /road/lane_centre_markers.
    carla_centre_enabled: true
    # Plan 30: the offset and heading at the reference from 8 m of centreline only (the curvature still from 15 m):
    # a curve starting or ending farther ahead no longer bends the heading (s1 heading p95 2.6 -> 1.8 deg).
    carla_centre_heading_m: 8.0
    # Real time: only the newest image waits (a slow frame drops the older one, latency does not pile up),
    # and the image is read in place from its serialized form.
    image_job_depth: 1
    raw_image_cdr: true
    # Overlay and debug images are drawn on their own thread, so they do not delay the next frame.
    debug_thread: true
    # Lane topics and the inline display go out on their own thread while the next frame is detected.
    output_thread: true
    gil_switch_interval_ms: 0.5
    # With display_filter_inline: the display filter runs in the perception worker, next to the detector.
    display_filter_in_worker: true
    # ... and published from there, as soon as the worker has it.
    display_publish_in_worker: true
    # The perception worker subscribes the camera and odometry itself: no image copy or hand-over in road_node.
    image_in_worker: true
    # Plan 28: stop lines and crosswalks (road_markings.py, rule based, without the learned mask) on /road/road_markings,
    # computed after the display line.  The lane outputs do not change.
    road_markings: true
    # Plan 25: with learned_weights the worker takes the camera too and hands the frames to the model process
    # (the image no longer goes through road_node).  Without learned weights nothing changes.
    learned_in_worker: true
lane_display_filter:
  ros__parameters:
    # HUD line reaches the rear axle (HUD path start, bottom of the screen); paint seen in the last
    # 10 m of travel fills below the first seen paint (~5.5 m), the fit's arc where there is none.
    near_m: 0.0
    memory_m: 10.0
    # Sharp curves: the HUD line is a cubic too, its third-order term held to 0 unless a quadratic misses by ~5 cm.
    cubic_m: 0.05
    # Line ends (plan 18): an observation must match the kept line at the near end, middle and far end of the
    # part both cover (gate 0.30 m, +0.30 m per 10 m beyond 10 m), not at 10 m alone; the line is drawn at most
    # 3 m (extend_m) past the median far end of the last 3 accepted observations and below the nearest seen or
    # remembered paint; outside that span it continues the end's slope with the curvature fading over 6 m, and
    # below 6 m it continues the slope and curvature at 6 m (the cubic swings most at 0 m).
    gate_span: true
    gate_per_10m: 1.0
    end_from_seen: true
    start_from_seen: true
    outside_quadratic: true
    near_quadratic_m: 6.0
